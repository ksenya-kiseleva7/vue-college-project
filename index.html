<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задания</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
</head>
<body>
<div id="app">

    <!-- Задание 1 -->
    <h2>Сумма элементов массива</h2>
    <p>Массив: {{ arr }}</p>
    <p>Сумма элементов: {{ sumOfArray }}</p>

    <!-- Задание 2 -->
    <h2>Счетчик</h2>
    <button @click="decreaseCounter">Уменьшить</button>
    <button @click="increaseCounter">Увеличить</button>
    <p>Текущее значение счетчика: {{ counter }}</p>

    <!-- Задание 3 -->
    <h2>Форма отправки сообщения</h2>
    <form @submit.prevent="sendMessage">
        <input v-model="newMessage" type="text" placeholder="Введите сообщение" />
        <button type="submit">Отправить</button>
    </form>
    <p>Отправленное сообщение: {{ sentMessage }}</p>

</div>

<script src="script.js"></script>
</body>
</html>
