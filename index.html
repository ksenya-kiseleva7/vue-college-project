<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление приложением</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
</head>
<body>
<div id="app">
    <div ref="con">
        Фамилия <input v-model="person.surname" /><p>
        Имя <input v-model="person.name" /><p>
        Отчество <input v-model="person.patronymic" /><p>
        Образование <input v-model="person.edu" /><p>
        Стаж <input v-model="person.experience" /><p>
        <button @click="addData()">Добавить данные</button>
    </div>
</div>

<script>
    new Vue({
        el: "#app",
        data: {
            person: {
                surname: '',
                name: '',
                patronymic: '',
                edu: '',
                experience: ''
            }
        },
        methods: {
            addData() {
                // Создаем содержимое для вставки
                const content = `
            <p>Фамилия: ${this.person.surname}</p>
            <p>Имя: ${this.person.name}</p>
            <p>Отчество: ${this.person.patronymic}</p>
            <p>Образование: ${this.person.edu}</p>
            <p>Стаж: ${this.person.experience}</p>
          `;

                // Заменяем содержимое блока ref="con" на данные
                this.$refs.con.innerHTML = content;
            }
        }
    });
</script>
</body>
</html>
