<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали заказа</title>
    <!-- Подключаем Vue.js из CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
</head>
<body>
<div id="app">
    <h2>Детали заказа</h2>
    <ul>
        <li><strong>ID:</strong> {{ orders[0] }}</li>
        <li><strong>Название:</strong> {{ orders[1] }}</li>
        <li><strong>Бренд:</strong> {{ orders[2] }}</li>
        <li><strong>Цвет:</strong> {{ orders[3] }}</li>
        <li><strong>Происхождение:</strong> {{ orders[4] }}</li>
        <li><strong>Наличие:</strong> {{ orders[5] }}</li>
        <li><strong>Размер:</strong> {{ orders[6] }}</li>
        <li><strong>Цена:</strong> {{ orders[7] }}</li>
        <li><strong>Изображение:</strong></li>
        <li><img :src="orders[8]" alt="Изображение товара"/></li>
    </ul>
</div>

<script>
    // Данные заказа
    var orders = ['1', 'Утепленная стеганая куртка', 'MARCO DI RADI', 'Синий', 'Китай', 'Есть', '52', '25.590', '6734671220.png'];

    // Создаем новый экземпляр Vue
    new Vue({
        el: '#app',
        data: {
            orders: orders
        }
    });
</script>
</body>
</html>
