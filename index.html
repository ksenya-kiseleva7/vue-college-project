<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление приложением</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
</head>
<body>
<h1>Управление приложением</h1>

<div id="app">
    <p><input @click="fClick($event)" type="radio" name="img" id="img1"> Я загадочный</p>
    <p><input @click="fClick($event)" type="radio" name="img" id="img2"> Я безбашенный</p>
    <p><input @click="fClick($event)" type="radio" name="img" id="img3"> Я влюбленный</p>
    <p><input @click="fClick($event)" type="radio" name="img" id="img4"> Я грустный</p>
    <p><input @click="fClick($event)" type="radio" name="img" id="img5"> Я стеснительный</p>
    <img v-bind:src="path" alt="Выбранное изображение" width="300">
</div>

<script>
    new Vue({
        el: "#app",
        data: {
            path: ''
        },
        methods: {
            fClick(event) {
                // Получаем id нажатой радио-кнопки
                const id = event.target.id;

                // Устанавливаем путь к соответствующему изображению
                this.path = `img/${id}.jpg`;
            }
        }
    });
</script>
</body>
</html>
